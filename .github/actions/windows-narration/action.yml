name: Windows narration dependencies
description: Build static OpenBLAS and configure the clang-cl narration engine
runs:
  using: composite
  steps:
    - uses: actions/cache@v4
      with:
        path: .vcpkg-narration/installed
        key: narration-openblas-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('scripts/windows-build.ps1', 'scripts/vcpkg-triplets/x64-windows-narration.cmake') }}
    - shell: pwsh
      run: |
        & ./scripts/setup-windows.ps1
        "SLOPSLIDE_OPENBLAS_DIR=$env:SLOPSLIDE_OPENBLAS_DIR" >> $env:GITHUB_ENV
        'SLOPSLIDE_REQUIRE_NARRATION_ENGINE=1' >> $env:GITHUB_ENV
        "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER" >> $env:GITHUB_ENV
        foreach ($tool in @('clang-cl.exe', 'cmake.exe')) {
          (Split-Path (Get-Command $tool -ErrorAction Stop).Source) >> $env:GITHUB_PATH
        }
