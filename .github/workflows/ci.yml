name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Windows narration dependencies
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-narration
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libopenblas-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: pnpm install --frozen-lockfile
      - name: Run all checks, including Codex protocol and subprocess regressions
        shell: bash
        run: ./check.sh
      - name: Verify explicit no-engine build
        if: runner.os == 'Windows'
        shell: bash
        env:
          SLOPSLIDE_NO_NARRATION_ENGINE: '1'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib narration --quiet
