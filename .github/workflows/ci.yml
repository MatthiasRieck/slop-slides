name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Test Windows setup scripts offline
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/test-windows-build.ps1
      - name: Install Windows narration dependencies
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-narration
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev libopenblas-dev patchelf xvfb
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - run: pnpm install --frozen-lockfile
      - name: Run all checks, including Codex protocol and subprocess regressions
        shell: bash
        run: ./check.sh
      # Exports drive platform code no unit test reaches (hidden windows, printing, captures).
      - name: Export a sample deck to PDF and PowerPoint
        timeout-minutes: 15
        shell: bash
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml --bin slopslide
          display=()
          if [[ "$RUNNER_OS" == Linux ]]; then display=(xvfb-run -a); fi
          "${display[@]}" src-tauri/target/debug/slopslide --export-smoke \
            fixtures/export-smoke/deck.html "$RUNNER_TEMP/export-smoke" \
            "Export smoke test" "Shapes and pictures" "Gradient card"
      - name: Upload the exported sample deck
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: export-smoke-${{ runner.os }}
          path: ${{ runner.temp }}/export-smoke
          if-no-files-found: ignore
      # Runners are Apple Silicon, so only the release would otherwise link the Intel app.
      - name: Verify Intel Mac build links
        if: runner.os == 'macOS'
        env:
          SLOPSLIDE_REQUIRE_NARRATION_ENGINE: '1'
        run: cargo build --manifest-path src-tauri/Cargo.toml --target x86_64-apple-darwin --bin slopslide
      - name: Verify explicit no-engine build
        if: runner.os == 'Windows'
        shell: bash
        env:
          SLOPSLIDE_NO_NARRATION_ENGINE: '1'
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib narration --quiet
