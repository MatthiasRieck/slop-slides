name: Narration real-model smoke
on:
  workflow_dispatch:
jobs:
  smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Set up Windows build tools
        if: runner.os == 'Windows'
        uses: ./.github/actions/windows-build
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev libasound2-dev patchelf
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --no-bundle
      - name: Load, render, measure, and stop real worker
        shell: bash
        run: python scripts/narration-smoke.py --exe src-tauri/target/release/slopslide${{ runner.os == 'Windows' && '.exe' || '' }} --work '${{ runner.temp }}/narration smoke 空間' --download
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: narration-measurements-and-audio-${{ runner.os }}
          path: |
            ${{ runner.temp }}/narration smoke 空間/measurements.json
            ${{ runner.temp }}/narration smoke 空間/*.wav
            ${{ runner.temp }}/narration smoke 空間/worker-stderr.log
