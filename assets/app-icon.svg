<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f3762"/>
      <stop offset="1" stop-color="#162a4e"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d3e0ec"/>
      <stop offset="1" stop-color="#b9cbdd"/>
    </linearGradient>
    <linearGradient id="front" gradientUnits="userSpaceOnUse" x1="0" y1="341" x2="0" y2="826">
      <stop offset="0" stop-color="#f4f7fb"/>
      <stop offset="1" stop-color="#e6ecf3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#08142b" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="78" y="78" width="868" height="868" rx="190" fill="url(#bg)"/>

  <!-- back card -->
  <rect x="172" y="322" width="600" height="348" rx="30" fill="url(#back)"
        transform="rotate(-7.5 172 322)" filter="url(#shadow)"/>

  <!-- front card with drip: one path so the gradient and shadow have no seam -->
  <path fill="url(#front)" filter="url(#shadow)" d="
    M259 341 H795 A28 28 0 0 1 823 369 V701
    C823 717 812 729 796 729
    C776 729 768 741 767 758
    C766 770 776 782 776 800
    A28 28 0 0 1 720 800
    C720 782 730 771 729 758
    C727 738 710 729 670 729
    H259 A28 28 0 0 1 231 701 V369 A28 28 0 0 1 259 341 Z"/>

  <!-- text lines -->
  <rect x="276" y="430" width="270" height="52" rx="14" fill="#1b2f55"/>
  <rect x="276" y="527" width="237" height="31" rx="15.5" fill="#7f97b0"/>
  <rect x="276" y="586" width="206" height="32" rx="16" fill="#7f97b0"/>

  <!-- play button -->
  <path d="M630 457 L630 597 L748 527 Z" fill="#4ecba5" stroke="#4ecba5"
        stroke-width="40" stroke-linejoin="round"/>
</svg>
