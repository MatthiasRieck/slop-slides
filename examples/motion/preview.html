<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Motion study preview</title></head>
<body>
<script>
fetch("deck.html").then(response => {
  if (!response.ok) throw new Error("Could not load the demo deck.");
  return response.text();
}).then(html => {
  html = html.replace("<head>", '<head><link rel="stylesheet" href="../../src-tauri/assets/runtime.css"><script>document.documentElement.setAttribute("data-slop-player", "")<\/script>');
  html = html.replace("</body>", '<script src="../../src-tauri/assets/runtime.js"><\/script></body>');
  document.open();
  document.write(html);
  document.close();
}).catch(error => { document.body.textContent = error.message; });
</script>
</body>
</html>
