<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SlopSlide</title>
    <!--
      The window's background in the chosen appearance, before the app's code and styles load, so
      a dark window does not start white. The colors are `--background` of src/index.css, and the
      script does what `applyAppearance` in src/lib/theme.ts does; src/test/firstPaint.test.ts
      holds both to it.
    -->
    <style>
      html { background: oklch(0.992 0 0); color-scheme: light; }
      html.dark { background: oklch(0.205 0 0); color-scheme: dark; }
    </style>
    <script>
      (function () {
        var choice = null;
        try {
          choice = localStorage.getItem("slopslide.appearance");
        } catch (error) {
          // Storage is unavailable: as the system shows.
        }
        var dark = choice === "dark" || (choice !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        // The interface's text size, as `applyTextSize` in src/lib/theme.ts sets it.
        var size = null;
        try {
          size = localStorage.getItem("slopslide.textSize");
        } catch (error) {
          // Storage is unavailable: the default size.
        }
        document.documentElement.style.fontSize = size === "small" ? "93.75%" : size === "large" ? "112.5%" : "";
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
