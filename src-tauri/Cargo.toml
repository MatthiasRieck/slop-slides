[package]
name = "slopslide"
version = "0.1.0"
description = "Chat-driven slide editor"
authors = ["Matthias Rieck"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "slopslide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "macros", "time"] }
notify = "8"
notify-debouncer-mini = "0.7"
which = "8"
thiserror = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
base64 = "0.23.1"

# Slide screenshots for sketches (see src/capture.rs); the same versions wry already uses.
[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSImage", "NSImageRep"] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSValue"] }
objc2-web-kit = { version = "0.3", features = ["block2", "objc2-app-kit", "objc2-core-foundation", "WKSnapshotConfiguration", "WKWebView"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
