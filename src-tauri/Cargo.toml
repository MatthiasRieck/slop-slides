[package]
name = "slopslide"
version = "0.1.0"
description = "Chat-driven slide editor"
authors = ["Matthias Rieck"]
edition = "2021"
rust-version = "1.80"

[lib]
name = "slopslide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "macros", "time"] }
notify = "8"
notify-debouncer-mini = "0.7"
which = "8"
thiserror = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
base64 = "0.23.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
