[package]
name = "slopslide"
version = "0.1.0"
description = "Chat-driven slide editor"
authors = ["Matthias Rieck"]
license = "MIT"
edition = "2021"
rust-version = "1.80"

[lib]
name = "slopslide_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# The narration speech engine (vendor/qwen3-tts, see build.rs), and OpenBLAS on Linux.
cc = "1"
pkg-config = "0.3"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "rt", "sync", "macros", "time"] }
notify = "8"
notify-debouncer-mini = "0.7"
which = "8"
thiserror = "2"
percent-encoding = "2"
uuid = { version = "1", features = ["v4"] }
log = "0.4"
base64 = "0.23.1"
cssparser = "0.37"
png = "0.18"

# Voice input in the chat composer (see src/voice.rs): microphone capture, the speech-to-text
# model's download, and whisper.cpp to run it.
cpal = "0.18"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["native-tls", "stream"] }
sha2 = "0.10"
whisper-rs = "0.16"
arboard = { version = "3.7.0", default-features = false, features = ["image-data"] }

# Video export (see src/video.rs): AV1, a royalty-free codec, encoded in Rust (no nasm or
# system libraries needed).
rav1e = { version = "0.8", default-features = false, features = ["threading"] }
# Narration in the video: Opus, royalty-free like AV1 (libopus, built from source).
opus = "0.4"

# Slide screenshots for sketches (see src/capture.rs) and PDF printing (src/pdf.rs); the same
# versions wry already uses.
[target.'cfg(target_os = "macos")'.dependencies]
whisper-rs = { version = "0.16", features = ["metal"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "block2", "AVCaptureDevice", "AVMediaFormat"] }  # microphone permission
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSBitmapImageRep", "NSImage", "NSImageRep", "NSPasteboard", "NSPrintInfo", "NSPrintOperation", "NSResponder", "NSView", "NSWindow"] }
objc2-foundation = { version = "0.3", features = ["NSData", "NSDictionary", "NSError", "NSGeometry", "NSString", "NSURL", "NSValue"] }
objc2-web-kit = { version = "0.3", features = ["block2", "objc2-app-kit", "objc2-core-foundation", "WKSnapshotConfiguration", "WKWebView"] }

# rav1e's ARM assembly builds with the C compiler; its x86 assembly would need nasm.
[target.'cfg(target_arch = "aarch64")'.dependencies]
rav1e = { version = "0.8", default-features = false, features = ["threading", "asm"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage"] }

[target.'cfg(target_os = "linux")'.dependencies]
cairo-rs = "0.18"
gtk = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[dev-dependencies]
ctor = "1.0.13"
jsonschema = { version = "0.33.0", default-features = false }

# The AV1 encoder is unusably slow unoptimized; optimize it in dev builds and tests too.
[profile.dev.package.rav1e]
opt-level = 3

[profile.dev.package.v_frame]
opt-level = 3
